<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EduAsset · Top bar</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: #7B1113; min-height: 72px; box-sizing: border-box; padding: 12px clamp(16px, 2vw, 24px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; border-bottom: 3px solid #F2B705">
  <a href="{{homeHref}}" aria-label="EduAsset home" style="display: flex; align-items: center; gap: 12px; min-height: 44px; text-decoration: none; color: #FFFFFF">
    <svg width="40" height="40" viewBox="0 0 120 120" aria-hidden="true"><rect x="4" y="4" width="112" height="112" rx="28" fill="#F2B705"></rect><rect x="28" y="30" width="14" height="60" rx="3" fill="#5A0F14"></rect><rect x="28" y="30" width="44" height="13" rx="3" fill="#5A0F14"></rect><rect x="28" y="53.5" width="34" height="13" rx="3" fill="#5A0F14"></rect><rect x="28" y="77" width="44" height="13" rx="3" fill="#5A0F14"></rect><rect x="80.5" y="31.5" width="13" height="13" rx="2" fill="none" stroke="#5A0F14" stroke-width="3"></rect><rect x="84.5" y="35.5" width="5" height="5" rx="1" fill="#5A0F14"></rect><rect x="80" y="54" width="6" height="6" rx="1" fill="#5A0F14"></rect><rect x="88" y="62" width="6" height="6" rx="1" fill="#5A0F14"></rect><rect x="80" y="70" width="6" height="6" rx="1" fill="#5A0F14"></rect><rect x="88" y="78" width="6" height="6" rx="1" fill="#5A0F14"></rect><rect x="80" y="84" width="6" height="6" rx="1" fill="#5A0F14"></rect></svg>
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Edu<span style="color: #F2B705">Asset</span></span>
      <span style="font-size: 12px; font-weight: 500; color: #F8D46A">{{portalName}}</span>
    </span>
  </a>
  <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5A0F14; background: #F8D46A; padding: 4px 10px; border-radius: 999px">PROTOTYPE · SAMPLE DATA</span>
    <a href="{{alertsHref}}" aria-label="{{alertsLabel}}" style="position: relative; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #5A0F14; color: #F8D46A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #F2B705; color: #5A0F14; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{alerts}}</span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 999px; background: #5A0F14">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: #F2B705; color: #5A0F14; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{initials}}</span>
      <span style="display: flex; flex-direction: column">
        <span style="font-size: 13px; font-weight: 600">{{user}}</span>
        <span style="font-size: 11px; color: #F8D46A">{{role}}</span>
      </span>
    </div>
    <a href="login.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: #FFF4D1; font-size: 13px; font-weight: 600; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
      Sign out
    </a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"portal":{"editor":"enum","options":["central","lab"],"default":"central"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const lab = (this.props.portal ?? 'central') === 'lab';
    const alerts = lab ? 2 : 11;
    return {
      portalName: lab ? 'WIL Lab Custodian Portal' : 'Central Property Custodian Portal',
      homeHref: lab ? 'lab-dashboard.dc.html' : 'central-dashboard.dc.html',
      alertsHref: lab ? 'lab-dashboard.dc.html' : 'central-audit-queue.dc.html',
      alerts, alertsLabel: alerts + ' alerts',
      user: lab ? '[Lab Assistant name]' : '[Custodian name]',
      initials: lab ? 'LA' : 'PC',
      role: lab ? 'WIL Lab Assistant' : 'Central Property Custodian'
    };
  }
}
</script>
</body>
</html>
